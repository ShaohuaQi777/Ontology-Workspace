      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/BackendRequest'
              - properties:
                  operation:
                    const: ingest
      responses:
        '200':
          description: Versioned success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendResponse'
        '422':
          description: Platform error result
